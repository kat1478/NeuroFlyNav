[project]
name = "neuroflynav"
version = "0.1.0"
description = "Connectome-constrained navigation with the Drosophila central complex"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Katarzyna Kadyszewska" }]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true
