name: Job image

# Builds the container for AWS Batch jobs and publishes it to GitHub Container Registry,
# tagged with the commit it was built from. Uses only the built-in GITHUB_TOKEN: no AWS
# access and no stored keys. Sweeps are still submitted by hand (see docs/cloud.md).

on:
  push:
    branches:
      - develop
    paths:
      - Dockerfile
      - .dockerignore
      - environment.yml
      - pyproject.toml
      - src/**
      - docker/**
      - app/public/data/treats.geojson
      - .github/workflows/image.yml
  # Pull requests that change the image are built (not pushed) to catch breakage early.
  pull_request:
    branches:
      - develop
    paths:
      - Dockerfile
      - .dockerignore
      - environment.yml
      - docker/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: job-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kat1478/neuroflynav

jobs:
  image:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Short commit SHA (the image tag, as in docs/cloud.md)
        id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.short }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
          labels: |
            org.opencontainers.image.title=neuroflynav
            org.opencontainers.image.description=NeuroFlyNav job image for AWS Batch (CPU)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Job image"
            echo ""
            echo "\`${IMAGE}:${{ steps.sha.outputs.short }}\`"
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Use it for a sweep: \`terraform -chdir=infra apply -var image_repository=${IMAGE} -var image_tag=${{ steps.sha.outputs.short }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
